<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; connect-src 'self'" />
  <title>框选游戏小地图区域</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: rgba(8, 12, 20, 0.42);
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      cursor: crosshair;
      user-select: none;
    }
    #hint {
      position: fixed;
      top: 22px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 16px;
      border-radius: 10px;
      background: rgba(12, 18, 28, 0.88);
      border: 1px solid rgba(120, 190, 255, 0.35);
      color: #dbe7f5;
      font-size: 13px;
      line-height: 1.6;
      text-align: center;
      pointer-events: none;
      box-shadow: 0 8px 26px rgba(0, 0, 0, 0.45);
      max-width: 86vw;
    }
    #hint b { color: #7fd0ff; }
    #hint .sub { color: #8fa3ba; font-size: 12px; }
    #sel {
      position: fixed;
      display: none;
      border: 1.5px solid #62c6ff;
      background: rgba(98, 198, 255, 0.14);
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.4), 0 0 18px rgba(98, 198, 255, 0.35);
      pointer-events: none;
    }
    #sel .tag {
      position: absolute;
      left: 0;
      top: -26px;
      padding: 2px 8px;
      border-radius: 5px;
      background: #62c6ff;
      color: #061019;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }
    #sel .corner {
      position: absolute;
      width: 8px;
      height: 8px;
      background: #e9f6ff;
      border-radius: 2px;
    }
  </style>
</head>
<body>
  <div id="hint">
    拖动鼠标框选游戏内<b>小地图圆形区域</b>（含完整圆盘）
    <div class="sub">建议框得略大一点以包含地图边缘 · Esc 取消</div>
  </div>
  <div id="sel"><span class="tag"></span>
    <i class="corner" style="left:-4px;top:-4px"></i>
    <i class="corner" style="right:-4px;top:-4px"></i>
    <i class="corner" style="left:-4px;bottom:-4px"></i>
    <i class="corner" style="right:-4px;bottom:-4px"></i>
  </div>

  <script src="./js/picker.js"></script>
</body>
</html>
